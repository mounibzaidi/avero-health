  - { id: sts-aats, name: "STS/AATS",     region: na, title: ['Society of Thoracic Surgeons', 'American Association for Thoracic Surgery', '\bAATS\b'], journals: ["Ann Thorac Surg", "J Thorac Cardiovasc Surg"] }
