  - { id: hfsa,   name: "HFSA",           region: na, title: ['\bHFSA\b', 'Heart Failure Society of America'], journals: ["J Card Fail"] }
  - { id: ccs,    name: "CCS (Canada)",   region: other, title: ['Canadian Cardiovascular Society'], journals: ["Can J Cardiol"] }
  - { id: csbp,   name: "Canadian Stroke Best Practices", region: other, title: ['Canadian Stroke Best Practice'] }
  - { id: jcs,    name: "JCS (Japon)",    region: other, title: ['\bJCS\b', 'Japanese Circulation Society'], journals: ["Circ J"] }
  - { id: jrc,    name: "JRC (Japon)",    region: other, title: ['Japan Resuscitation Council'] }
  - { id: jssc,   name: "J-SSCG (Japon)", region: other, title: ['J-SSCG', 'Japanese Clinical Practice Guidelines for Management of Sepsis'] }
  - { id: jss,    name: "Japan Stroke Society", region: other, title: ['Japan Stroke Society'] }
  - { id: csanz,  name: "NHF/CSANZ (Australie)", region: other, title: ['National Heart Foundation of Australia', 'Cardiac Society of Australia and New Zealand', '\bCSANZ\b'] }
  - { id: thanz,  name: "THANZ (Australie)", region: other, title: ['Thrombosis and Haemostasis Society of Australia'] }
  - { id: anmco,  name: "ANMCO (Italie)", region: other, title: ['\bANMCO\b'] }
  - { id: sec,    name: "SEC (Espagne)",  region: other, title: ['\bSEC-', 'Spanish Society of Cardiology'] }
