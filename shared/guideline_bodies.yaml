# Issuing bodies of clinical guidelines: how a search result is attributed to one.
# Order of evidence: a title pattern (the body names itself), then an author (a collective name), then the journal.
# `region` feeds the origin-first ranking (dz, fr, then eu, na, intl, then other). Edit freely: nothing else holds a copy.

bodies:
  - { id: esc,    name: "ESC",            region: eu, title: ['\bESC\b', 'European Society of Cardiology'], authors: ['ESC Scientific Document Group'], journals: ["Eur Heart J", "Europace", "Eur J Heart Fail", "Eur J Prev Cardiol", "Eur Heart J Acute Cardiovasc Care", "Eur Heart J Cardiovasc Imaging", "Eur Heart J Cardiovasc Pharmacother", "EuroIntervention"] }
  - { id: aha-acc, name: "AHA/ACC",       region: na, title: ['\bAHA\b', '\bACC\b', 'American Heart Association', 'American College of Cardiology'], authors: ['Joint Committee on Clinical Practice Guidelines'], journals: ["Circulation", "J Am Coll Cardiol"] }
  - { id: ers,    name: "ERS",            region: eu, title: ['\bERS\b', 'European Respiratory Society'], journals: ["Eur Respir J"] }
  - { id: ats,    name: "ATS",            region: na, title: ['\bATS\b', 'American Thoracic Society'], journals: ["Am J Respir Crit Care Med"] }
  - { id: chest,  name: "CHEST",          region: na, title: ['\bCHEST\b', 'American College of Chest Physicians'], journals: ["Chest"] }
  - { id: kdigo,  name: "KDIGO",          region: intl, title: ['\bKDIGO\b'], journals: ["Kidney Int", "Kidney Int Suppl (2011)"] }
  - { id: era,    name: "ERA",            region: eu, title: ['\bERA\b', 'European Renal Association'], journals: ["Nephrol Dial Transplant"] }
  - { id: esh,    name: "ESH",            region: eu, title: ['\bESH\b', 'European Society of Hypertension'], journals: ["J Hypertens"] }
  - { id: ada,    name: "ADA",            region: na, title: ['\bADA\b', 'American Diabetes Association', 'Standards of Care in Diabetes'], journals: ["Diabetes Care"] }
  - { id: easd,   name: "EASD",           region: eu, title: ['\bEASD\b'], journals: ["Diabetologia"] }
  - { id: idsa,   name: "IDSA",           region: na, title: ['\bIDSA\b', 'Infectious Diseases Society of America'], journals: ["Clin Infect Dis"] }
  - { id: escmid, name: "ESCMID",         region: eu, title: ['\bESCMID\b'], journals: ["Clin Microbiol Infect"] }
  - { id: ssc,    name: "Surviving Sepsis Campaign", region: intl, title: ['Surviving Sepsis Campaign'] }
  - { id: sccm,   name: "SCCM",           region: na, title: ['Society of Critical Care Medicine', '\bSCCM\b'], journals: ["Crit Care Med", "Pediatr Crit Care Med"] }
  - { id: eso,    name: "ESO",            region: eu, title: ['\bESO\b', 'European Stroke Organisation'], journals: ["Eur Stroke J"] }
  - { id: aha-asa, name: "AHA/ASA",       region: na, title: ['\bASA\b', 'American Stroke Association'], journals: ["Stroke"] }
  - { id: erc,    name: "ERC",            region: eu, title: ['\bERC\b', 'European Resuscitation Council'], journals: ["Resuscitation"] }
  - { id: gold,   name: "GOLD",           region: intl, title: ['\bGOLD\b', 'Global Initiative for Chronic Obstructive Lung Disease'] }
  - { id: gina,   name: "GINA",           region: intl, title: ['\bGINA\b', 'Global Initiative for Asthma'] }
  - { id: nice,   name: "NICE",           region: eu, title: ['\bNICE\b', 'National Institute for Health and Care Excellence'] }
  - { id: who,    name: "OMS",            region: intl, title: ['\bWHO\b', 'World Health Organization'] }
  - { id: isth,   name: "ISTH",           region: intl, title: ['\bISTH\b'], journals: ["J Thromb Haemost"] }
  - { id: asco,   name: "ASCO",           region: na, title: ['\bASCO\b'], journals: ["J Clin Oncol"] }
  - { id: esmo,   name: "ESMO",           region: eu, title: ['\bESMO\b'], journals: ["Ann Oncol"] }
  - { id: eaaci,  name: "EAACI",          region: eu, title: ['\bEAACI\b', 'European Academy of Allergy and Clinical Immunology'], journals: ["Allergy"] }
  - { id: wao,    name: "WAO",            region: intl, title: ['\bWAO\b', 'World Allergy Organization'], journals: ["World Allergy Organ J"] }
  - { id: jtf,    name: "AAAAI/ACAAI",    region: na, title: ['Joint Task Force on Practice Parameters', '\bAAAAI\b', '\bACAAI\b'], journals: ["J Allergy Clin Immunol", "Ann Allergy Asthma Immunol"] }
  - { id: ilae,   name: "ILAE",           region: intl, title: ['\bILAE\b', 'International League Against Epilepsy'], journals: ["Epilepsia"] }
  - { id: ncs,    name: "Neurocritical Care Society", region: na, title: ['Neurocritical Care Society'], journals: ["Neurocrit Care"] }
  - { id: ean,    name: "EAN",            region: eu, title: ['\bEAN\b', 'European Academy of Neurology', '\bEFNS\b'], journals: ["Eur J Neurol"] }
  - { id: esicm,  name: "ESICM",          region: eu, title: ['\bESICM\b', 'European Society of Intensive Care Medicine'], journals: ["Intensive Care Med"] }
  - { id: bts,    name: "BTS",            region: eu, title: ['British Thoracic Society', '\bBTS\b'], journals: ["Thorax"] }
