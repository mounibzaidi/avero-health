# Protocols: crawler sources
# reuse: open        = openly licensed or public domain, can store and structure
#        check       = reuse terms unclear, read them before storing text
#        link_only   = restrictive licence, store link + metadata, not content
# verify: true = domain from memory, confirm it before crawling
# priority: 1 = crawl first, 2 = next, 3 = later
# added: true = added to the original list (important for Algerian practice or for a topic in topics.yaml)
# region: where the source's documents come from, for the ranking (scraper/doc_kinds.py origin_of):
#         dz, fr, eu (Europe, UK included), na (USA, Canada), maghreb, intl. None (PMC): read from each title
# note: anything to know before crawling (filled by scraper/check_sources.py where it found something)
# start: optional page to start crawling from, for a site without a sitemap (default: its home page)
# Crawler etiquette: respect robots.txt, rate-limit (1 request / few seconds), identify your user agent.

maghreb:
  - { id: dz-ministry,  name: "Ministère de la Santé (Algérie)",               lang: fr,    scope: "National programmes, circulars",          url: "https://sante.gov.dz",  region: dz, reuse: check, priority: 1, manual: "pas de page de recommandations (notes et arrêtés seulement) : ajout manuel" }
  - { id: dz-insp,      name: "Institut National de Santé Publique (Algérie)", lang: fr,    scope: "Public health, surveillance, programmes", url: "https://www.insp.dz",       region: dz, reuse: check, priority: 1, manual: "pas de page listant les conduites à tenir : ajout manuel" }
  - { id: dz-pasteur,   name: "Institut Pasteur d'Algérie",                    lang: fr,    scope: "Vaccination, rabies post-exposure, scorpion and snake antivenoms", url: "https://www.pasteur.dz/fr/", region: dz, reuse: check, priority: 1, added: true }
  - { id: dz-cnt,       name: "Centre National de Toxicologie (Algérie)",      lang: fr,    scope: "Poisoning, scorpion envenomation, CO",    url: "https://www.cnt.dz",        region: dz, reuse: check, priority: 2, added: true }
  - { id: tn-ineas,     name: "INEAS (Tunisie)",                               lang: fr,    scope: "Tunisian national guidelines, HAS-style", url: "https://www.ineas.tn",      region: maghreb, reuse: check, priority: 1, verify: true, note: "check 2026-09-29: home page answers 404 to our crawler; find the guidelines section URL by hand" }
  - { id: ma-sante,     name: "Ministère de la Santé (Maroc)",                 lang: fr,    scope: "National programmes and protocols",       url: "https://www.sante.gov.ma",  region: maghreb, reuse: check, priority: 3, verify: true, added: true, note: "check 2026-09-29: connection refused; domain to confirm" }

international:
  - { id: who,          name: "World Health Organization",                     lang: "en,fr", scope: "All; many docs also in French",         url: "https://www.who.int",       region: intl, reuse: open,  priority: 1, note: "robots.txt blocks AI crawlers by name (CCBot); our crawler is allowed, but read their terms on AI use before storing text" }
  - { id: who-iris,     name: "WHO IRIS repository",                           lang: "en,fr", scope: "Full-text WHO publications",            url: "https://iris.who.int",      region: intl, reuse: open,  priority: 1 }
  - { id: who-afro,     name: "WHO Regional Office for Africa",                lang: "en,fr", scope: "Algeria's WHO region: regional programmes, outbreaks", url: "https://www.afro.who.int", region: intl, reuse: open, priority: 2, added: true }
  - { id: who-emro,     name: "WHO Regional Office for the Eastern Mediterranean", lang: "en,fr,ar", scope: "Tunisia and Morocco's region; Arabic material", url: "https://www.emro.who.int", region: intl, reuse: open, priority: 3, added: true, note: "robots.txt blocks AI crawlers by name (GPTBot, CCBot); our crawler is allowed, but read their terms on AI use before storing text" }
  - { id: msf,          name: "MSF Medical Guidelines",                        lang: "en,fr", scope: "Clinical, essential drugs, low-resource settings; includes envenomations", url: "https://medicalguidelines.msf.org", region: intl, reuse: check, priority: 1, note: "robots.txt blocks AI crawlers by name (GPTBot, ClaudeBot, anthropic-ai, CCBot, Google-Extended); our crawler is allowed, but read their terms on AI use before storing text" }
  - { id: cdc,          name: "CDC (US)",                                      lang: en,    scope: "Infections, vaccination, public health",  url: "https://www.cdc.gov",       region: na, reuse: open,  priority: 2 }
  - { id: pmc,          name: "PubMed Central open access",                    lang: "en,fr", scope: "Practice guidelines published open access (licence per article)", url: "https://pmc.ncbi.nlm.nih.gov", reuse: check, priority: 1, added: true, note: "already collected by scraper/pmc.py; only CC licences allowing adaptation; robots.txt disallows crawling the site: collect only through the E-utilities API and the open-access S3 bucket (scraper/pmc.py); robots.txt blocks AI crawlers by name (GPTBot, ClaudeBot, anthropic-ai, CCBot, Google-Extended); our crawler is allowed, but read their terms on AI use before storing text" }
  - { id: ilcor,        name: "ILCOR (resuscitation science)",                 lang: en,    scope: "Cardiac arrest, first aid: consensus on science", url: "https://www.ilcor.org", region: intl, reuse: check, priority: 2, added: true }

