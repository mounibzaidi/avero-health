# Protocols: predefined topics. The single list the crawler matches sources against, the dashboard
# seeds subjects from, and the app groups protocols by. Edit here; nothing else holds a copy.
#
# priority: 1 = build first (demo), 2 = next, 3 = later
# local_program: true = check Algerian Ministry of Health / INSP sources first (not crawled yet:
#   the matcher flags these topics so a person looks there before using a foreign guideline)
# keywords_fr: extra French terms and acronyms. Acronyms (all capitals) match as whole words only.
# exclude: terms that make a catalogue entry wrong for this topic even when a name matches.
# synonyms: other names of the topic, in French or English ("hypertensive crisis" for a hypertensive emergency):
#   a title that has one names the topic, like fr and en. British and American spellings and plurals
#   already match each other (dyslipidaemia / dyslipidemia, emergency / emergencies): no need to list both.
# broader: a broader topic whose documents treat this one as a chapter ("hypertension" for a hypertensive
#   emergency). A document that names nothing closer is kept for it, low in the list, and says so.
# neighbors: terms of a neighbouring topic ("chronic coronary" for an acute coronary topic): a result whose
#   title has one stays in the list but loses points (scraper/doc_kinds.py rank), so it sinks below the topic's own.
# fiche: the topic's own fiche: its title and its clinical moment (one fiche = one clinical moment). The planner
#   (backend/factory/plan.py) keeps the pages of this moment and proposes sibling fiches when it holds too much.
# elsewhere: what belongs to another topic's fiche, {topic id: [terms]}: a line or a page that has one of the
#   terms is left out of this topic's fiches (post-cardiac-arrest care is not an acute coronary fiche).
# audience: specialist = keep interventional, surgical and device recommendations (left out by default: the
#   fiches are for general practitioners and emergency physicians).
# expect: ids of shared/sources.yaml whose guidance this topic cannot do without (ERC for cardiac arrest).
#   When a search cannot read one of them, or finds nothing there, the dashboard says so in red: such a
#   source is never silently missing.

groups:
  emergencies:
    cardiovascular: Cardiovasculaire
    respiratory: Respiratoire
    shock-infection: Choc et infection
    neurological: Neurologie
    metabolic: Métabolique
    gastrointestinal: Digestif
    toxicology-envenomation: Toxicologie et envenimations
    trauma-environment: Traumatologie
    obstetric: Obstétrique
    paediatric: Pédiatrie
    psychiatric: Psychiatrie
  gp_consultations:
    cardiometabolic: Cardiométabolique
    infections: Infections
    respiratory: Respiratoire
    digestive: Digestif
    musculoskeletal: Rhumatologie
    neuro-mental: Neurologie et santé mentale
    haematology: Hématologie
    skin: Dermatologie
    women-children-prevention: Femme, enfant, prévention
    symptoms: Motifs de consultation

