# Protocols: the registered source documents (gate 1). Read by backend/factory/sources.py.
# shared/sources.yaml lists the publishers the crawler visits; this file lists the documents the fiches
# cite, each registered once. A document that is not here has no kind: its fiche shows a gap.
#
# id: its path in scraper/downloads/ (the source_id every line cites)
# kind: what the document may support
#   national_dz   Ministry, INSP: everything, takes priority for Algeria
#   guideline     HAS, WHO, societies: indications, decisions, grades (a dose only if stated in full)
#   product_info  RCP / SmPC: doses, maximum dose, administration, contraindications
#   register      nomenclature: brand names, strengths, forms only
# published_date: as printed in the document. Older than 5 years: flagged "ancienne".
# version, license: empty until read from the document or its publisher's terms.

