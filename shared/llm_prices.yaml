# Prices per million tokens (USD), for the cost log of fiche generation (services/api/app/fichegen/llm.py).
# cache_write = 5-minute cache write; batch = multiplier on everything for the Message Batches API.
batch: 0.5
models:
  claude-haiku-5-5:  { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }

# LlamaParse: credits per page by tier, dollars per credit ($1.25 per 1,000 credits, LlamaParse pricing page).
llamaparse:
  credit_usd: 0.00125
  tiers: { fast: 1, cost_effective: 3, agentic: 10, agentic_plus: 45 }
