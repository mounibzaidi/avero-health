# Register match (gate 3): what the national nomenclature cannot say by itself. Read by
# backend/factory/register.py; edited by hand, each entry with where it comes from.
#
# rules: for one DCI in one topic (shared/topics.yaml id), the strengths indicated there, written as
#   the nomenclature writes them. A presentation of that DCI with another strength is "non indiqué ici".
#   A drug without a rule for its topic has its strength and indication unchecked: the completeness
#   check lists it for the reviewer.
# exceptions: registered presentations the list (shared/dz_brands.json) cannot attach to their DCI,
#   because the nomenclature writes the DCI another way. Form, dosage and hospital as written there.
#   A presentation the nomenclature lists under its DCI is never repeated here. An exception is offered
#   only in a topic that has a rule for its DCI (its strength is then checked); the app does not carry them.

rules:
  - { dci: TENECTEPLASE, topic: stroke, dosage: ["25MG (5000UNITES)"], note: "AVC ischémique : flacon de 25 mg uniquement (RCP Metalyse 25 mg)", source: "Nomenclature nationale, août 2026" }
  - { dci: ADRENALINE,   topic: cardiac-arrest, dosage: ["1MG/ML"], note: "Arrêt cardiaque : ampoules injectables ; pas les anesthésiques dentaires contenant de l'adrénaline", source: "Nomenclature nationale, août 2026" }
  - { dci: AMIODARONE,   topic: cardiac-arrest, dosage: ["50MG/ML", "50MG/ML (150MG/3ML)"], note: "Arrêt cardiaque : forme injectable ; pas les comprimés à 200 mg", source: "Nomenclature nationale, août 2026" }

exceptions:
  # The nomenclature writes this product's DCI "TENECTEPLASE GENNOVA", so it is not found under TENECTEPLASE.
  - { dci: TENECTEPLASE, brand: ELAXIM, dosage: "1000 U/ML OU 5MG/ML (10 000U/10ML OU 50MG/10ML)", form: "PDRE. ET SOLV. INJ. IV", hospital: true, source: "Nomenclature nationale, août 2026 (code 12 F 129, HOP) ; pas dans l'AVC" }
