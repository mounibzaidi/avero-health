# Render Blueprint (render.com → New → Blueprint → this repo): the Avero API as a Docker web service.
# Values marked sync: false are asked for once in the Render dashboard; they are never stored in the repo.
services:
  - type: web
    name: avero-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
